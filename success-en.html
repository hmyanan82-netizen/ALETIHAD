<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0f9f6e;
      --primary-dark: #0d875f;
      --shadow: rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eef7f3 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 10px 28px var(--shadow);
      padding: 36px 24px;
      text-align: center;
    }
    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(15, 159, 110, 0.12);
      display: grid;
      place-items: center;
      color: var(--primary);
    }
    .icon svg {
      width: 52px;
      height: 52px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: var(--primary-dark);
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      text-decoration: none;
      background: var(--primary);
      color: #fff;
      border-radius: 12px;
      padding: 12px 24px;
      font-weight: 700;
    }
    .btn:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
    </div>
    <h1>Operation Successful</h1>
    <p>Your request has been approved successfully, and verification is complete.</p>
    <a class="btn" href="index_en.html">Back to Home</a>
  </div>
</body>
</html>
