<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1b2a41;
      --muted: #667085;
      --green: #1e9f67;
      --green-dark: #117a4d;
      --shadow: 0 18px 45px rgba(25,38,62,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      width: min(100%, 520px);
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 36px 28px;
      text-align: center;
    }
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .logo-wrap img {
      width: 140px;
      height: auto;
      display: block;
    }
    .icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(30, 159, 103, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      color: var(--green);
    }
    .icon svg {
      width: 52px;
      height: 52px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      color: var(--green-dark);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 17px;
    }
    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .btn:hover {
      background: var(--green-dark);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="https://i.ibb.co/sdZKRjw3/preview-vip-200602142541g6ht3.png" alt="VIP Logo" />
    </div>

    <div class="icon" aria-label="Success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.5l4.5 4.5L19 3.5"/>
      </svg>
    </div>

    <h1>Operation Successful</h1>
    <p>Your request was approved successfully, and the required steps will continue as needed.</p>
    <a href="index_en.html" class="btn">Back to Home</a>
  </div>
</body>
</html>
