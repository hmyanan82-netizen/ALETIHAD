<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نجاح</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #f4f7fb, #e8f3ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2d3d;
    }
    .card {
      width: min(92vw, 520px);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
      padding: 32px 28px;
      text-align: center;
    }
    .icon {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 18px;
      background: #eafaf1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1ea660;
      font-size: 46px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      color: #0f7a41;
    }
    p {
      margin: 0;
      font-size: 18px;
      line-height: 1.7;
      color: #334155;
    }
    .meta {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>تمت العملية بنجاح</h1>
    <p>تمت الموافقة على طلبك بنجاح. شكرًا لك على ثقتك.</p>
    <div class="meta" id="requestMeta">رقم الطلب: --</div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var requestId = params.get('id');
    var meta = document.getElementById('requestMeta');
    if (meta) {
      meta.textContent = 'رقم الطلب: ' + (requestId || '--');
    }
  </script>
</body>
</html>
