<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نجاح</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #0d6efd;
      --success: #1ca75a;
      --text: #1f2937;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text);
    }
    .card {
      width: min(92vw, 480px);
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
      padding: 32px 24px 28px;
      text-align: center;
    }
    .icon {
      width: 86px;
      height: 86px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: rgba(28, 167, 90, 0.11);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--success);
      font-size: 44px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: var(--success);
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }
    .btn {
      display: inline-block;
      margin-top: 22px;
      text-decoration: none;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 12px 22px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>تمت العملية بنجاح</h1>
    <p>تمت الموافقة على الطلب بنجاح، وسيتم متابعة الإجراءات اللازمة.</p>
    <a class="btn" href="index.html">العودة للصفحة الرئيسية</a>
  </div>
</body>
</html>
